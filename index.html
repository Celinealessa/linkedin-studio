function toN(v) { return parseInt(String(v||'').replace(/[^\d-]/g,''))||0; }
function sum(a) { return a.reduce((x,y)=>x+y,0); }
function avg(a) { return a.length ? sum(a)/a.length : 0; }
function fmt(n) { return Math.round(n).toLocaleString('de-DE'); }
function fmtK(n){ return n>=1000?(n/1000).toFixed(0)+'K':String(n); }
function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];
}
function contrastColor(hex) {
  try { const [r,g,b]=hexToRgb(hex); return (r*0.299+g*0.587+b*0.114)>140?'#1A1F36':'#FFFFFF'; }
  catch { return '#FFFFFF'; }
}

function editCustomNote(clientId) {
  const c = getClient(clientId || ROUTE.clientId); if(!c) return;
  const overlay = document.createElement('div');
  overlay.id = 'customNoteOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9000;display:flex;align-items:center;justify-content:center';
  overlay.innerHTML = `<div style="background:#fff;border-radius:16px;padding:28px;width:min(560px,95vw);box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="font-weight:700;font-size:16px;margin-bottom:14px">📝 Eigene Notiz / Empfehlung</div>
    <textarea id="customNoteTA" style="width:100%;height:180px;border:1.5px solid #E2E6F0;border-radius:10px;padding:12px;font-size:13px;font-family:'DM Sans',sans-serif;resize:vertical;background:#F8F9FF;color:#1A1F36;box-sizing:border-box" placeholder="Hier eigene Empfehlungen, Notizen oder Maßnahmen eintragen…">${(c.customNote||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button onclick="document.getElementById('customNoteOverlay').remove()" style="padding:8px 18px;border-radius:8px;border:1px solid #E2E6F0;background:none;cursor:pointer;font-family:'DM Sans',sans-serif;color:#1A1F36">Abbrechen</button>
      <button onclick="saveCustomNote('${clientId||ROUTE.clientId}')" style="padding:8px 18px;border-radius:8px;background:#5B63FE;color:#fff;border:none;cursor:pointer;font-weight:600;font-family:'DM Sans',sans-serif">Speichern</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('customNoteTA').focus(),50);
}
function saveCustomNote(clientId) {
  const c = getClient(clientId); if(!c) return;
  const ta = document.getElementById('customNoteTA'); if(!ta) return;
  c.customNote = ta.value;
  saveApp();
  document.getElementById('customNoteOverlay')?.remove();
  navigate('dash', clientId || ROUTE.clientId);
}

function resetRecsToBlank(clientId) {
  const c = getClient(clientId || ROUTE.clientId); if(!c) return;
  const blank = {color:'#5B63FE', badgeBg:'#EEEFFE', badgeCol:'#2D3561', badge:'', val:'', title:'—', body:'', rec:''};
  c.recommendations = [{ ...blank }, { ...blank, color:'#00A86B', badgeBg:'#E8F8F2', badgeCol:'#00624A' }, { ...blank, color:'#F59E0B', badgeBg:'#FFF0D6', badgeCol:'#7A4500' }];
  saveApp();
  navigate('dash', ROUTE.clientId);
}

function setRecColor(hex) {
  document.getElementById('rec_color').value = hex;
  document.getElementById('rec_color_pick').value = hex;
  document.querySelectorAll('#recModal button[onclick^="setRecColor"]').forEach(b => {
    b.style.border = b.getAttribute('onclick').includes(hex) ? '3px solid #1A1F36' : '3px solid transparent';
  });
}
function editRec(i) {
  const c = getClient(ROUTE.clientId); if(!c) return;
  const r = c.recommendations[i];
  document.getElementById('recIdx').value = i;
  document.getElementById('rec_badge').value = r.badge||'';
  document.getElementById('rec_val').value   = r.val||'';
  document.getElementById('rec_title').value = r.title === '—' ? '' : (r.title||'');
  document.getElementById('rec_body').value  = r.body||'';
  document.getElementById('rec_rec').value   = r.rec||'';

  // CI-Farben des Kunden + feste Basisfarben in die Swatches injizieren
  const ci = c.ci || {};
  const ciColors = [ci.primary, ci.accent, ci.color2, ci.color3].filter(Boolean);
  const fixedColors = ['#00A86B','#E03B3B','#F59E0B','#5B63FE','#7B68EE','#FF6600'];
  const allColors = [...new Set([...ciColors, ...fixedColors])];
  const swatchContainer = document.getElementById('recColorSwatches');
  if (swatchContainer) {
    swatchContainer.innerHTML = allColors.map(col => {
      const isCi = ciColors.includes(col);
      return `<button onclick="setRecColor('${col}')" style="width:28px;height:28px;border-radius:50%;background:${col};border:3px solid transparent;cursor:pointer;${isCi?'box-shadow:0 0 0 2px #fff,0 0 0 4px '+col+'88;':''}" title="${col}"></button>`;
    }).join('') + `<input type="color" id="rec_color_pick" value="#5B63FE" oninput="setRecColor(this.value)" style="width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;padding:0" title="Eigene Farbe">`;
  }

  setRecColor(r.color||ci.primary||'#5B63FE');
  openModal('recModal');
}
function saveRec() {
  const c = getClient(ROUTE.clientId); if(!c) return;
  const i = parseInt(document.getElementById('recIdx').value);
  const color = document.getElementById('rec_color').value || '#5B63FE';
  const title = document.getElementById('rec_title').value.trim() || '—';
  c.recommendations[i] = { ...c.recommendations[i],
    badge: document.getElementById('rec_badge').value,
    val:   document.getElementById('rec_val').value,
    title,
    body:  document.getElementById('rec_body').value,
    rec:   document.getElementById('rec_rec').value,
    color,
    badgeBg: color+'22', badgeCol: color,
  };
  c.updatedAt = Date.now(); saveApp();
  closeModal('recModal'); navigate('dash', ROUTE.clientId);
  showToast('Empfehlung gespeichert', 'ok');
}
function editMix(i) {
  const c = getClient(ROUTE.clientId); if(!c) return;
  const mx = c.contentMix[i];
  document.getElementById('mixIdx').value    = i;
  document.getElementById('mix_num').value   = mx.num||'';
  document.getElementById('mix_color').value = mx.color||'#5B63FE';
  document.getElementById('mix_title').value = mx.title||'';
  document.getElementById('mix_sub').value   = mx.sub||'';
  openModal('mixModal');
}
function saveMix() {
  const c = getClient(ROUTE.clientId); if(!c) return;
  const i = parseInt(document.getElementById('mixIdx').value);
  c.contentMix[i] = {
    num:   document.getElementById('mix_num').value,
    color: document.getElementById('mix_color').value,
    title: document.getElementById('mix_title').value,
    sub:   document.getElementById('mix_sub').value,
  };
  c.updatedAt = Date.now(); saveApp();
  closeModal('mixModal'); navigate('dash', ROUTE.clientId);
  showToast('Content-Mix gespeichert', 'ok');
}
