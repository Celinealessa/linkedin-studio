<script>
// Auto cache-buster: check every time the tab is opened (not just once per session)
(function(){
  const MY_V = 'v20260603-59';
  const CACHE_KEY = '_lv_checked';
  const last = parseInt(localStorage.getItem(CACHE_KEY)||'0');
  const now = Date.now();
  // Check at most once every 60 seconds to avoid reload loops
  if (now - last < 60000 && sessionStorage.getItem('_lv') === MY_V) return;
  sessionStorage.setItem('_lv', MY_V);
  localStorage.setItem(CACHE_KEY, String(now));
  fetch(location.pathname + '?_t=' + now, {cache:'no-store'})
    .then(r => r.text())
    .then(html => {
      const m = html.match(/<!-- (v\d{8}-\d+) -->/);
      if (m && m[1] !== MY_V) { location.reload(true); }
    }).catch(()=>{});
})();
</script>

<style>
/* ══════════════════════════════════════════
   TOKENS & RESET
══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --app-blue:    #1A1F36;
  --app-blue2:   #2D3561;
  --app-accent:  #5B63FE;
  --app-accent2: #4048E8;
  --app-yellow:  #FFD100;
  --bg:          #F0F2F9;
  --surface:     #FFFFFF;
  --text:        #1A1F36;
  --muted:       #6E7A9F;
  --border:      #E3E8F4;
  --success:     #00A86B;
  --danger:      #E03B3B;
  --warn:        #F59E0B;
  --radius:      12px;
  --radius-sm:   8px;
  --shadow:      0 2px 16px rgba(26,31,54,0.08);
  --shadow-md:   0 8px 32px rgba(26,31,54,0.12);
  --sidebar-w:   240px;
}

html { font-size: 15px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
}

/* ══════════════════════════════════════════
   APP SHELL
══════════════════════════════════════════ */
.app-shell {
  display: flex; min-height: 100vh;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--app-blue);
  display: flex; flex-direction: column;
  position: fixed; left: 0; top: 0; bottom: 0;
  overflow-y: auto; z-index: 50;
  transition: transform 0.25s;
}
.sidebar-brand {
  padding: 20px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sidebar-logo {
  display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
}
.sidebar-logo-mark {
  width: 32px; height: 32px; background: var(--app-accent);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.sidebar-app-name {
  font-size: 13px; font-weight: 600; color: #fff;
  letter-spacing: 0.01em;
}
.sidebar-tagline {
  font-size: 10px; color: rgba(255,255,255,0.35);
  font-family: 'DM Mono', monospace;
}

.sidebar-nav { padding: 12px 8px; flex: 1; }
.sidebar-section-label {
  font-size: 9px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.12em; color: rgba(255,255,255,0.3);
  padding: 8px 8px 4px;
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px;
  font-size: 13px; color: rgba(255,255,255,0.6);
  cursor: pointer; transition: all 0.15s;
  margin-bottom: 2px;
  border: none; background: none; width: 100%;
  font-family: 'DM Sans', sans-serif; text-align: left;
}
.sidebar-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.sidebar-item.active { background: var(--app-accent); color: #fff; }
.sidebar-item .si-icon { width: 18px; text-align: center; font-size: 14px; flex-shrink: 0; }
.sidebar-item .si-badge {
  margin-left: auto; background: rgba(255,255,255,0.15);
  font-size: 10px; padding: 2px 7px; border-radius: 20px;
}

.sidebar-add-btn {
  margin: 8px; padding: 10px;
  background: rgba(91,99,254,0.2); border: 1px dashed rgba(91,99,254,0.5);
  border-radius: 8px; color: #8B93FF;
  font-size: 12px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: all 0.15s; width: calc(100% - 16px);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.sidebar-add-btn:hover { background: rgba(91,99,254,0.35); color: #fff; }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 11px; color: rgba(255,255,255,0.25);
}

/* ── Main Content ── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1; min-height: 100vh;
  display: flex; flex-direction: column;
}
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 0 2rem; height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 40;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--muted);
}
.breadcrumb-sep { opacity: 0.4; }
.breadcrumb .current { color: var(--text); font-weight: 500; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.content { flex: 1; padding: 2rem; max-width: 1200px; width: 100%; }

/* ══════════════════════════════════════════
   BUTTONS & INPUTS
══════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  cursor: pointer; border: 1px solid var(--border); background: var(--bg);
  color: var(--text); transition: all 0.15s; white-space: nowrap;
}
.btn:hover { background: var(--border); }
.btn-primary { background: var(--app-accent); border-color: var(--app-accent); color: #fff; box-shadow: 0 2px 8px rgba(91,99,254,0.3); }
.btn-primary:hover { background: var(--app-accent2); border-color: var(--app-accent2); }
.btn-danger { color: var(--danger); border-color: #FFCECE; background: #FFF5F5; }
.btn-danger:hover { background: #FFE5E5; }
.btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 6px; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--bg); border-color: var(--border); }

.form-group { margin-bottom: 14px; }
.form-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; display: block; }
.form-input {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text);
  background: #fff; transition: border-color 0.15s;
}
.form-input:focus { outline: none; border-color: var(--app-accent); box-shadow: 0 0 0 3px rgba(91,99,254,0.1); }
.form-input[type=color] { padding: 3px 5px; height: 38px; cursor: pointer; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ══════════════════════════════════════════
   HOME SCREEN
══════════════════════════════════════════ */
.home-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem;
}
.home-title { font-size: 22px; font-weight: 600; }
.home-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

.clients-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.client-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem;
  box-shadow: var(--shadow); cursor: pointer;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.client-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--app-accent); }
.client-card-stripe { position: absolute; top: 0; left: 0; right: 0; height: 4px; }
.client-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.client-card-logo {
  width: 44px; height: 44px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; flex-shrink: 0; overflow: hidden;
}
.client-card-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.client-card-name { font-size: 15px; font-weight: 600; }
.client-card-period { font-size: 11px; color: var(--muted); margin-top: 2px; }
.client-card-kpis { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; }
.client-kpi { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.client-kpi-val { font-size: 16px; font-weight: 600; }
.client-kpi-label { font-size: 10px; color: var(--muted); margin-top: 1px; }
.client-card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 12px; padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--muted);
}
.client-status {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600;
}
.status-ready  { background: #E8F8F2; color: #00624A; }
.status-draft  { background: #FFF9D6; color: #7A5C00; }
.status-empty  { background: var(--bg); color: var(--muted); }

.new-client-card {
  background: transparent; border: 2px dashed var(--border);
  border-radius: var(--radius); padding: 2rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; min-height: 200px;
  color: var(--muted);
}
.new-client-card:hover { border-color: var(--app-accent); color: var(--app-accent); background: rgba(91,99,254,0.03); }
.new-client-icon { font-size: 28px; margin-bottom: 8px; }
.new-client-label { font-size: 13px; font-weight: 500; }

.empty-state {
  text-align: center; padding: 4rem 2rem;
  display: flex; flex-direction: column; align-items: center;
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.empty-sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }

/* ══════════════════════════════════════════
   EDIT SCREEN
══════════════════════════════════════════ */
.edit-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 1.5rem;
}
.edit-logo-preview {
  width: 48px; height: 48px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; overflow: hidden; flex-shrink: 0;
}
.edit-logo-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.edit-client-name { font-size: 20px; font-weight: 600; }
.edit-client-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

.step-tabs {
  display: flex; gap: 4px; margin-bottom: 1.5rem;
  background: var(--bg); padding: 4px; border-radius: 10px;
  width: fit-content;
}
.step-tab {
  padding: 8px 18px; border-radius: 7px; border: none;
  font-size: 13px; font-weight: 500; font-family: 'DM Sans', sans-serif;
  cursor: pointer; color: var(--muted); background: none; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.step-tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.step-tab .step-num { width: 18px; height: 18px; border-radius: 50%; background: var(--border); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.step-tab.active .step-num { background: var(--app-accent); color: #fff; }
.step-tab.done .step-num { background: var(--success); color: #fff; }

.edit-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.5rem;
  box-shadow: var(--shadow); margin-bottom: 1rem;
}
.edit-section-title {
  font-size: 13px; font-weight: 600; margin-bottom: 1rem;
  padding-bottom: 10px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}

/* CI color preview bar */
.ci-bar {
  height: 40px; border-radius: 8px;
  display: flex; align-items: center; padding: 0 14px; gap: 10px;
  font-size: 13px; font-weight: 500; margin-top: 10px;
  transition: all 0.2s;
}

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--border); border-radius: 10px;
  padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s;
}
.upload-zone:hover, .upload-zone.drag { border-color: var(--app-accent); background: rgba(91,99,254,0.03); }
.upload-icon { font-size: 26px; margin-bottom: 6px; }
.upload-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.upload-sub { font-size: 11px; color: var(--muted); }

.data-ok { display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--success); font-weight: 500; padding: 8px 12px; background: #E8F8F2; border-radius: 8px; margin-bottom: 10px; }
.data-ok.show { display: flex; }

/* Data table */
.dt-wrap { overflow-x: auto; margin-top: 8px; }
.dt { width: 100%; border-collapse: collapse; font-size: 12px; }
.dt th { padding: 6px 8px; text-align: left; background: var(--bg); color: var(--muted); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; border-bottom: 2px solid var(--border); white-space: nowrap; }
.dt td { padding: 3px 5px; border-bottom: 1px solid var(--border); }
.dt tr:last-child td { border-bottom: none; }
.dt input, .dt select {
  width: 100%; padding: 4px 7px; border: 1px solid var(--border); border-radius: 5px;
  font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text); background: #fff;
  text-align: right;
}
.dt input:focus, .dt select:focus { outline: none; border-color: var(--app-accent); }
.dt .t-left input, .dt .t-left { text-align: left; }
.dt .t-left input { text-align: left; font-family: 'DM Sans', sans-serif; }
.dt .del-btn { width: 24px; height: 24px; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 14px; border-radius: 4px; }
.dt .del-btn:hover { background: #FFE5E5; color: var(--danger); }
.add-row { font-size: 12px; color: var(--app-accent); cursor: pointer; padding: 6px 2px; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
.add-row:hover { text-decoration: underline; }

.type-sel option { font-family: 'DM Sans', sans-serif; }

/* ══════════════════════════════════════════
   DASHBOARD
══════════════════════════════════════════ */
.dash-topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  height: 52px; display: flex; align-items: center;
  padding: 0 2rem; gap: 8px; position: sticky; top: 56px; z-index: 39;
}
.dash-header {
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;

.hero { border-radius: var(--radius); padding: 1.75rem 2rem; margin-bottom: 1.5rem; position: relative; overflow: hidden; }

.hero-kpis { display: flex; gap: 2rem; flex-wrap: wrap; }
.hero-kpi-val { font-size: 28px; font-weight: 600; line-height: 1; }
.hero-kpi-lbl { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em; }

/* KPI cards */
.kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 1.5rem; }
.kpi-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:1.2rem 1.2rem 1rem; box-shadow:var(--shadow); position:relative; overflow:hidden; }

.kpi-lbl { font-size:11px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:8px; }
.kpi-val { font-size:26px; font-weight:600; line-height:1; }
.kpi-sub { font-size:11px; color:var(--muted); margin-top:6px; }
.txt-g { color:var(--success); } .txt-r { color:var(--danger); } .txt-o { color:var(--warn); }

/* Chart cards */
.chart-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; box-shadow:var(--shadow); }
.chart-title { font-size:13px; font-weight:600; margin-bottom:3px; }
.chart-sub { font-size:11px; color:var(--muted); margin-bottom:14px; }
.chart-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:1.25rem; }
.chart-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:1.25rem; }
.legend { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
.legend-dot { width:10px; height:10px; border-radius:2px; flex-shrink:0; }

/* Split banner */
.split { display:grid; grid-template-columns:1fr auto 1fr; background:#fff; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-bottom:1.25rem; }
.split-side { padding:1.25rem 1.5rem; }
.split-before { background:#FFF5F5; }
.split-after  { background:#F0FBF7; }
.split-div { width:40px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; }
.collab-body { display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s ease; overflow:hidden; }
.collab-body.open { grid-template-rows:1fr; }
.split-lbl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; }
.split-before .split-lbl { color:var(--danger); }
.split-after  .split-lbl { color:var(--success); }
.split-rows { display:flex; flex-direction:column; gap:8px; }
.split-row { display:flex; justify-content:space-between; font-size:13px; align-items:center; }
.split-row-lbl { color:var(--muted); }
.split-before .split-row-val { color:var(--danger); font-weight:600; font-size:15px; }
.split-after  .split-row-val { color:var(--success); font-weight:600; font-size:15px; }

/* Posts */
.posts-list { display:flex; flex-direction:column; gap:7px; }
.post-row { display:grid; grid-template-columns:28px 1fr auto auto; gap:10px; align-items:center; padding:9px 12px; background:var(--bg); border-radius:var(--radius-sm); border:1px solid transparent; transition:all 0.15s; }
.post-row:hover { background:#EEF1FF; border-color:#C5C9F8; }

.post-cap { font-size:13px; line-height:1.4; }
.post-meta { font-size:10px; color:var(--muted); font-family:'DM Mono',monospace; margin-top:2px; }
.post-pill { font-size:10px; font-weight:600; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.post-impr { font-size:14px; font-weight:600; font-family:'DM Mono',monospace; text-align:right; min-width:60px; }
/* Post overlay modal */
#postOverlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:9999; align-items:center; justify-content:center; padding:20px; }

#postOverlayBox { background:#fff; border-radius:18px; padding:28px 28px 24px; max-width:560px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.25); position:relative; max-height:90vh; overflow-y:auto; }
.po-close { position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:#9BA0E0; line-height:1; }
.po-rank { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#9BA0E0; margin-bottom:10px; }
.po-caption { font-size:15px; line-height:1.55; color:#1A1D2E; margin-bottom:18px; font-weight:500; }
.po-metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; margin-bottom:20px; }
.po-metric { background:#F4F5FF; border-radius:10px; padding:12px 14px; text-align:center; }
.po-metric-val { font-size:22px; font-weight:700; font-family:'DM Mono',monospace; color:#3B3FCC; }
.po-metric-lbl { font-size:10px; color:#6E7A9F; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
.po-btn { display:inline-flex; align-items:center; gap:6px; background:#0077B5; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; }

/* Insight cards */
.insight-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:1.25rem; }
.insight-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.insight-stripe { position:absolute; top:0; left:0; right:0; height:4px; }

.insight-val { font-size:20px; font-weight:600; margin-bottom:2px; }
.insight-title { font-size:13px; font-weight:600; margin-bottom:6px; }
.insight-body { font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:8px; }
.insight-rec { font-size:12px; font-weight:500; }

/* ══════════════════════════════════════════
   MODAL
══════════════════════════════════════════ */
.overlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(26,31,54,0.5); align-items:center; justify-content:center; backdrop-filter:blur(3px); }
.overlay.open { display:flex; }
.modal { background:#fff; border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.2); width:90%; max-width:480px; overflow:hidden; }
.modal-h { padding:1.25rem 1.5rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-h h3 { font-size:15px; font-weight:600; }
.modal-x { width:28px; height:28px; border:none; background:var(--bg); border-radius:6px; cursor:pointer; font-size:15px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
.modal-x:hover { background:#FFE5E5; color:var(--danger); }
.modal-b { padding:1.5rem; }
.modal-f { padding:1rem 1.5rem; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }

/* ══════════════════════════════════════════
   TOAST
══════════════════════════════════════════ */
.toast { position:fixed; bottom:24px; right:24px; z-index:9999; background:var(--app-blue); color:#fff; padding:10px 18px; border-radius:9px; font-size:13px; font-weight:500; box-shadow:0 4px 20px rgba(0,0,0,0.2); transform:translateY(80px); opacity:0; transition:all 0.3s; pointer-events:none; }

.toast.ok, .toast.success { background:var(--success); }
.toast.warn { background:var(--warn); }
.toast.info { background:#5B63FE; }

/* ── STRATEGY CARDS ── */
.strat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:1.5rem; }
.strat-card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; box-shadow:var(--shadow); position:relative; overflow:hidden; }

/* ══════════════════════════════════════════

@media print {
  /* ── Hide everything except the dashboard content */
  .sidebar, .topbar, .toast, .overlay,
  .edit-section, #stepCI, #stepData, #stepPosts,
  button, .breadcrumb, .topbar-actions,
  #roTopbar > div:last-child,
  .dash-header .btn, .btn { display:none !important; }

  /* ── Reset layout */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body, html { background: #fff !important; }
  .main { margin-left: 0 !important; padding: 0 !important; }
  .app-shell { display: block !important; }
  #viewContainer, #sharedDashContent { max-width: 100% !important; padding: 0 16px !important; }

  /* ── Topbar stays but static */
  .topbar { display:none !important; }
  #roTopbar { display:flex !important; position:relative !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; margin-bottom:16px; }

  /* ── Dashboard header */
  .dash-header { position: relative !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin-bottom: 16px; }
  .dh-actions { display: none !important; }

  /* ── Cards & charts: preserve colors */
  .kpi-card, .chart-card, .split, .insight-card, .post-row,
  .hero, .hero-inner, .kpi-grid { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* ── Page breaks */
  .kpi-grid        { page-break-inside: avoid; }
  .chart-card      { page-break-inside: avoid; margin-bottom: 12px !important; }
  .split           { page-break-inside: avoid; }
  .insight-card    { page-break-inside: avoid; }
  .section-hd      { page-break-after: avoid; }
  .posts-list      { page-break-inside: avoid; }

  /* ── Collab banner stays closed on print */
  .collab-body     { display: none !important; }
  .split-body      { display: none !important; }

  /* ── Charts: fixed height so they don't overflow */
  canvas { max-height: 200px !important; }

  /* ── Recommendations grid */
  .insight-grid { grid-template-columns: repeat(2,1fr) !important; }

  /* ── Hide non-essential elements */
  .legend { display: none !important; }
  .po-rank { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  @page {
    size: A4 portrait;
    margin: 14mm 12mm 14mm 12mm;
  }
}

}

// ── Share encoding — nur alphanumerische Zeichen + Bindestrich (100% URL-sicher)
function shareEncode(obj) {
  if (typeof LZString !== 'undefined') {
    // compressToBase64 → nur A-Z a-z 0-9 + / = → URL-safe machen
    const b64 = LZString.compressToBase64(JSON.stringify(obj));
    return 'z2' + b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  }
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
function shareDecode(str) {
  // Zuerst URL-Encoding auflösen (manche Apps kodieren % etc.)
  try { str = decodeURIComponent(str); } catch(e) {}

  if (str.startsWith('z2') && typeof LZString !== 'undefined') {
    // Neues Format: z2 + URL-safe base64
    const b64 = str.slice(2).replace(/-/g,'+').replace(/_/g,'/');
    const pad = b64 + '==='.slice(0,(4-b64.length%4)%4);
    const decompressed = LZString.decompressFromBase64(pad);
    if (!decompressed) throw new Error('Dekomprimierung leer (z2)');
    return JSON.parse(decompressed);
  }
  if (str.charAt(0) === 'z' && typeof LZString !== 'undefined') {
    // Altes Format: z + encodedURIComponent
    const decompressed = LZString.decompressFromEncodedURIComponent(str.slice(1));
    if (!decompressed) throw new Error('Dekomprimierung leer (z)');
    return JSON.parse(decompressed);
  }
  // Legacy: unkomprimierter Link
  const b64 = str.replace(/-/g,'+').replace(/_/g,'/');
  const pad = b64 + '==='.slice(0,(4-b64.length%4)%4);
  const bin = atob(pad);
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

// ── Payload für Share aufbauen
function buildSharePayload(c) {
  const m = c.monthly || {};
  return {
    ci: { primary:c.ci.primary, accent:c.ci.accent, color2:c.ci.color2||'',
          color3:c.ci.color3||'', client:c.ci.client, person:c.ci.person||'',
          period:c.ci.period||'', agency:c.ci.agency||'', logo:c.ci.logo||'' },
    monthly: m.labels ? { labels:m.labels, impressions:m.impressions,
      followers:m.followers, engagements:m.engagements,
      postsPerMonth:m.postsPerMonth, totalFollowers:m.totalFollowers||0 } : null,
    posts: (c.posts||[]).map(p=>({caption:(p.caption||'').slice(0,120),label:p.label,impr:p.impr||0,eng:p.eng||0,likes:p.likes||0,comments:p.comments||0,shares:p.shares||0,url:p.url||'',type:p.type||'story'})),
    flopPosts: (c.flopPosts||[]).map(p=>({caption:(p.caption||'').slice(0,120),label:p.label,impr:p.impr||0,eng:p.eng||0,likes:p.likes||0,comments:p.comments||0,shares:p.shares||0,url:p.url||'',type:p.type||'story'})),
    splitLabel: c.splitLabel||'',
    recommendations: c.recommendations||null,
    contentMix: c.contentMix||null,
    customNote: c.customNote||''
  };
}

// ── On load: ?share=… (oder legacy #share=…) → Dashboard direkt aus URL laden
function checkShareParam() {
  // Neues Format: ?share= (Query-Parameter, WhatsApp-sicher)
  const params = new URLSearchParams(location.search);
  let encoded = params.get('share');
  // Legacy-Fallback: #share= (altes Format)
  if (!encoded) {
    const hash = location.hash;
    if (hash.startsWith('#share=')) encoded = hash.slice(7);
  }
  if (!encoded) return false;

  // Lade-Anzeige sofort zeigen
  document.body.innerHTML = `<div id="_shareLoading" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'DM Sans',sans-serif;flex-direction:column;gap:12px;color:#555"><div style="font-size:36px">⏳</div><div style="font-size:15px;font-weight:600">Dashboard wird geladen…</div></div>`;

  // Kurze Pause damit Browser DOM rendern kann, dann dekodieren
  setTimeout(() => {
    try {
      if (typeof LZString === 'undefined') throw new Error('LZString nicht geladen');
      const raw = shareDecode(encoded);
      if (!raw) throw new Error('Dekomprimierung fehlgeschlagen');
      if (!raw.ci) throw new Error('CI-Daten fehlen');
      if (!raw.monthly) throw new Error('Monatsdaten fehlen');
      renderReadOnlyDashboard(raw);
    } catch(e) {
      console.error('[Share]', e);
      const hashLen = encoded.length;
      document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'DM Sans',sans-serif;flex-direction:column;gap:14px;color:#555;padding:24px;text-align:center">
        <div style="font-size:52px">⚠️</div>
        <div style="font-size:18px;font-weight:700">Dashboard konnte nicht geladen werden</div>
        <div style="font-size:13px;background:#fff;padding:12px 18px;border-radius:8px;color:#E03B3B;max-width:400px">${e.message}</div>
        <div style="font-size:11px;color:#aaa">Hash-Länge: ${hashLen} Zeichen · LZString: ${typeof LZString}</div>
        <a href="https://celinealessa.github.io/linkedin-studio/" style="color:#5B63FE;font-size:13px;margin-top:4px">→ Zur App</a>
        <div style="font-size:11px;color:#aaa;margin-top:8px">Bitte einen neuen Link über das Dashboard erstellen.</div>
      </div>`;
    }
  }, 50);
  return true;
}

// ── Sync all local data to online app (desktop → GitHub Pages)
function syncToOnline() {
  try {
    const encoded = shareEncode(APP);
    const url = 'https://celinealessa.github.io/linkedin-studio/#syncimport=' + encoded;
    window.open(url, '_blank');
    showToast('Online-App wird geöffnet und Daten importiert…','ok');
  } catch(e) { showToast('Fehler: '+e.message,'warn'); }
}

// ── On load: check if URL contains a full APP sync import
function checkSyncImport() {
  const hash = location.hash;
  if (!hash.startsWith('#syncimport=')) return false;
  const encoded = hash.slice(12);
  if (!encoded) return false;
  try {
    const imported = shareDecode(encoded);
    if (!imported.clients) throw new Error('Keine Clients gefunden');
    // Merge: keep existing clients, add/update imported ones
    imported.clients.forEach(ic => {
      if (!ic.id) return;
      const ei = APP.clients.findIndex(x=>x.id===ic.id);
      if (ei>=0) APP.clients[ei] = {...APP.clients[ei], ...ic};
      else APP.clients.push(ic);
    });
    saveApp();
    history.replaceState(null,'',location.pathname); // remove hash
    showToast(`✅ ${imported.clients.length} Kunden synchronisiert!`,'ok');
  } catch(e) { showToast('Sync fehlgeschlagen: '+e.message,'warn'); }
  return false;
}

function setStep(step) {
  ROUTE.step = step;
  ['CI','Data','Posts'].forEach(s => {
    const el = document.getElementById('step'+s);
    if (el) el.style.display = step.toLowerCase()===s.toLowerCase() ? '' : 'none';
  });
  document.querySelectorAll('.step-tab').forEach((t,i) => {
    t.classList.toggle('active', ['ci','data','posts'][i]===step);
  });
  // Restore posts rows whenever posts step is shown
  if (step === 'posts') {
    const c = getClient(ROUTE.clientId);
    if (c) { restorePostsRows(c.posts || []); restoreFlopPostsRows(c.flopPosts || []); }
  }
}

// ── Live CI preview
let _activeColorPicker = 'ci_primary';
function applyColorSwatch(hex) {
  const inp = document.getElementById(_activeColorPicker);
  if (!inp) return;
  inp.value = hex;
  liveEditCI();
}
function liveEditCI() {
  const primary = document.getElementById('ci_primary')?.value || '#000';
  const accent  = document.getElementById('ci_accent')?.value || '#fff';
  const client  = document.getElementById('ci_client')?.value || 'Kunde';
  const logo    = document.getElementById('ci_logo')?.value || client.charAt(0);
  // Vorschau aktualisieren
  const bar = document.getElementById('ciBar');
  if (bar) {
    bar.style.background = primary;
    bar.style.color = contrastColor(primary);
    document.getElementById('ciBarLogo').style.background = accent;
    document.getElementById('ciBarLogo').style.color = contrastColor(accent);
    document.getElementById('ciBarLogo').textContent = logo;
    document.getElementById('ciBarName').textContent = client + ' · LinkedIn Analytics';
  }
  const lp = document.getElementById('editLogoPreview');
  if (lp) { lp.style.background = primary; lp.style.color = contrastColor(primary); lp.innerHTML = logo; }
  const en = document.getElementById('editClientName');
  if (en) en.textContent = client;
  // Sofort ins Client-Objekt speichern (kein "Weiter" nötig)
  const c = getClient(ROUTE.clientId);
  if (!c) return;
  c.ci.client  = client;
  c.ci.person  = document.getElementById('ci_person')?.value.trim() || c.ci.person || '';
  c.ci.period  = document.getElementById('ci_period')?.value.trim() || c.ci.period || '';
  c.ci.agency  = document.getElementById('ci_agency')?.value.trim() || c.ci.agency || '';
  c.ci.primary = primary;
  c.ci.accent  = accent;
  c.ci.color2  = document.getElementById('ci_color2')?.value || primary;
  c.ci.color3  = document.getElementById('ci_color3')?.value || primary;
  c.ci.logo    = logo;
  c.updatedAt  = Date.now();
  saveApp();
  renderSidebar();
}

let _tmpLogoImg = '';
function handleLogoUpload(input) {
  if (!input.files[0]) return;
  const r = new FileReader();
  r.onload = e => { _tmpLogoImg = e.target.result; liveEditCI(); };
  r.readAsDataURL(input.files[0]);
}

// ── Zahl parsen (DE: 1.234,56 → 1234.56 | EN: 1,234.56 → 1234.56 | "2,5%" → 2.5)
function parseNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return Math.round(v);
  let s = String(v).trim().replace(/%\s*$/, ''); // Prozentzeichen entfernen
  // DE-Format: 1.234,56 → Punkt=Tausender, Komma=Dezimal
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,'').replace(',','.');
  // Sonst: Komma als Tausendertrennzeichen (EN: 1,234)
  else s = s.replace(/,/g,'');
  return Math.round(parseFloat(s)) || 0;
}

// ── Column keyword detection
function findCol(header, keywords) {
  for (let i = 0; i < header.length; i++) {
    const h = String(header[i]||'').toLowerCase().replace(/[_\s\-\.]/g,'');
    if (keywords.some(kw => h.includes(kw.replace(/[_\s\-\.]/g,'')))) return i;
  }
  return -1;
}

// ── Is this value a full date (contains day)?
function isFullDate(val) {
  const s = String(val||'').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return true;          // ISO 2025-01-15
  if (/^\d{1,2}[./]\d{1,2}[./]\d{4}/.test(s)) return true; // DE 15.01.2025
  if (/^[A-Za-z]{3,}\s+\d{1,2},?\s+\d{4}/.test(s)) return true; // Jan 15, 2025
  if (/^\d{5}$/.test(s)) return true;                       // Excel serial
  if (/^\d{1,2}\s+[A-Za-z]{3,}\s+\d{2,4}$/.test(s)) return true; // Favikon "16 Dec 25"
  return false;
}

// ── Parse any date → {year, month 0-indexed} or null
// Handles: ISO, German (15.01.2025), LinkedIn DE ("15. Jan. 2025", "Jan. 2025"), EN, Excel serial
function parseDate(val) {
  if (val === null || val === undefined) return null;

  // Excel serial (number stored as number by XLSX)
  if (typeof val === 'number' && val > 40000 && val < 60000) {
    const d = new Date((val - 25569) * 86400 * 1000);
    return { year: d.getUTCFullYear(), month: d.getUTCMonth() };
  }

  const s = String(val).trim().replace(/​/g,''); // strip zero-width spaces
  if (!s) return null;

  const MEN = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const MDE = ['jan','feb','mär','mrz','apr','mai','jun','jul','aug','sep','okt','nov','dez'];
  // Extended DE month names
  const MDE_FULL = ['januar','februar','märz','april','mai','juni','juli','august','september','oktober','november','dezember'];

  function miFromStr(str) {
    const k = str.toLowerCase().replace(/\.$/, '').trim();
    let i = MEN.findIndex(m => k.startsWith(m));
    if (i < 0) i = MDE.findIndex(m => k.startsWith(m));
    if (i < 0) i = MDE_FULL.findIndex(m => k.startsWith(m));
    return i;
  }

  // Excel serial string "45678"
  if (/^\d{5}$/.test(s)) {
    const d = new Date((+s - 25569) * 86400 * 1000);
    return { year: d.getUTCFullYear(), month: d.getUTCMonth() };
  }
  // ISO: 2025-01-15 or 2025-01
  const iso = s.match(/^(\d{4})-(\d{2})(?:-\d{2})?/);
  if (iso) return { year:+iso[1], month:+iso[2]-1 };
  // German full: 15.01.2025 or 15. 01. 2025
  const de = s.match(/^(\d{1,2})[\.\s]+(\d{1,2})[\.\s]+(\d{4})/);
  if (de) return { year:+de[3], month:+de[2]-1 };

  // LinkedIn DE: "15. Jan. 2025" or "15. Januar 2025"
  const liDE = s.match(/^(\d{1,2})\.\s*([A-Za-zÄäÖöÜüß\.]+)\s+(\d{4})/);
  if (liDE) { const mi = miFromStr(liDE[2]); if(mi>=0) return {year:+liDE[3], month:mi}; }

  // LinkedIn DE monthly: "Jan. 2025" or "Januar 2025"
  const liMon = s.match(/^([A-Za-zÄäÖöÜüß]+)\.?\s+(\d{4})/);
  if (liMon) { const mi = miFromStr(liMon[1]); if(mi>=0) return {year:+liMon[2], month:mi}; }

  // Favikon: "16 Dec 25" or "16 Dec 2025" (DD Mon YY/YYYY)
  const fav = s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{2,4})$/);
  if (fav) { const mi = miFromStr(fav[2]); if(mi>=0) { const yr = fav[3].length===2 ? 2000+parseInt(fav[3]) : +fav[3]; return {year:yr, month:mi}; } }

  // Short: "Jan 25" "Feb. 26"
  const short = s.match(/^([A-Za-zÄäÖöÜüß]+)\.?\s+(\d{2})$/);
  if (short) { const mi = miFromStr(short[1]); if(mi>=0) return {year:2000+parseInt(short[2]), month:mi}; }

  // EN: "January 15, 2025"
  const en1 = s.match(/^([A-Za-z]+)\s+(\d{1,2}),?\s*(\d{4})/);
  if (en1) { const mi=miFromStr(en1[1]); if(mi>=0) return {year:+en1[3],month:mi}; }

  // US: M/D/YYYY or MM/DD/YYYY (LinkedIn AggregateAnalytics export)
  const us = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (us) return { year:+us[3], month:+us[1]-1 };

  // MM/YYYY or MM-YYYY
  const my = s.match(/^(\d{2})[\/\-](\d{4})$/);
  if (my) return { year:+my[2], month:+my[1]-1 };

  return null;
}

function fmtMonthLabel(year, month) {
  return ['Jan','Feb','Mrz','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'][month]+' '+String(year).slice(-2);
}

// Multi-file handler — processes all files and merges results
// ── Proper CSV parser — handles quoted fields with commas/newlines (e.g. Favikon captions)
function parseCSV(text) {
  // Detect separator: semicolon wins if more frequent than comma outside quotes
  const testLine = text.split('\n')[0] || '';
  let semiCount = 0, commaCount = 0, inQ = false;
  for (const ch of testLine) {
    if (ch === '"') inQ = !inQ;
    else if (!inQ) { if (ch===';') semiCount++; else if (ch===',') commaCount++; }
  }
  const sep = semiCount > commaCount ? ';' : ',';

  const rows = [];
  let row = [], field = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuote && text[i+1] === '"') { field += '"'; i++; }   // escaped quote ""
      else inQuote = !inQuote;
    } else if (ch === sep && !inQuote) {
      row.push(field.trim()); field = '';
    } else if ((ch === '\n' || (ch === '\r' && text[i+1] === '\n')) && !inQuote) {
      if (ch === '\r') i++;
      row.push(field.trim()); rows.push(row); row = []; field = '';
    } else {
      field += ch;
    }
  }
  if (field || row.length) { row.push(field.trim()); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}

let _multiQueue = [], _multiResults = [], _mergeMode = false;
function handleMultiFiles(fileList, merge) {
  const files = Array.from(fileList);
  if (!files.length) return;
  _mergeMode = !!merge;
  _multiQueue = files.slice();
  _multiResults = [];
  // Show loading state in upload zone
  const inner = document.getElementById('uploadZoneInner');
  const loading = document.getElementById('uploadZoneLoading');
  const loadingText = document.getElementById('uploadLoadingText');
  if (inner) inner.style.display = 'none';
  if (loading) loading.style.display = '';
  if (loadingText) loadingText.textContent = `${files.length} Datei${files.length>1?'en':''} wird${files.length>1?'':'d'} eingelesen…`;
  processNextInQueue();
}
function resetUploadZone() {
  const inner = document.getElementById('uploadZoneInner');
  const loading = document.getElementById('uploadZoneLoading');
  if (inner) inner.style.display = '';
  if (loading) loading.style.display = 'none';
}
function processNextInQueue() {
  if (!_multiQueue.length) { finalizeMultiImport(); return; }
  const file = _multiQueue.shift();
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext==='csv') {
    const r=new FileReader();
    r.onload=e=>{ smartImport_collect(e.target.result, 'csv', file.name); processNextInQueue(); };
    r.readAsText(file,'UTF-8');
  } else {
    const r=new FileReader();
    r.onload=e=>{ smartImport_collect(e.target.result, 'xlsx', file.name); processNextInQueue(); };
    r.readAsArrayBuffer(file);
  }
}
function smartImport_collect(data, type, filename) {
  // Parse file → result object, push to _multiResults
  console.log('[Upload] Processing:', filename, 'type:', type);
  try {
    let rows;
    if (type==='csv') {
      rows = parseCSV(data);
      console.log('[Upload] CSV rows:', rows.length);
    } else {
      const wb = XLSX.read(data, { type:'array', cellDates:false, raw:false });
      console.log('[Upload] Sheets:', wb.SheetNames.join(', '));
      // ── LinkedIn AggregateAnalytics format detection (ENGAGEMENT, TOP POSTS, FOLLOWERS sheets)
      const liSheets = ['ENGAGEMENT','TOP POSTS','FOLLOWERS','DISCOVERY','TOP-BEITRÄGE','FOLLOWER_INNEN','AUFFINDBARKEIT','DEMOGRAFISCHE DATEN'];
      if (wb.SheetNames.some(n => liSheets.includes(n))) {
        console.log('[Upload] LinkedIn AggregateAnalytics format detected');
        const result = parseLinkedInAggregateAnalytics(wb);
        console.log('[Upload] Parse result:', result ? result.d.labels.length + ' months' : 'null');
        if (result) { result._filename = filename; _multiResults.push(result); return; }
        console.warn('[Upload] AggregateAnalytics parse returned null, falling back');
      }
      let bestRows=[], bestScore=-1;
      for (const name of wb.SheetNames) {
        const ws = wb.Sheets[name];
        const r = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false });
        if (r.length < 2) continue;
        const header = r.slice(0,4).map(row=>row.join(' ')).join(' ').toLowerCase();
        const score = (r.length*0.1)
          + (/impressi|impression/.test(header)?10:0)
          + (/datum|date|veröffent|published/.test(header)?8:0)
          + (/reaktion|like|comment|komment/.test(header)?5:0)
          + (/follower|abonnent/.test(header)?4:0);
        if (score > bestScore) { bestScore=score; bestRows=r; }
      }
      rows = bestRows;
    }
    if (!rows || rows.length < 2) { showToast(`⚠️ ${filename}: Keine Daten gefunden`,'warn'); return; }
    const result = smartImport_parse(rows);
    if (result) { result._filename = filename; _multiResults.push(result); }
    else showToast(`⚠️ ${filename}: Format nicht erkannt`,'warn');
  } catch(e) { showToast(`⚠️ ${filename}: ${e.message}`,'warn'); }
}

function processDataFile(file) { handleMultiFiles([file]); }
function smartImport_fromXLSX(buf) { _multiResults=[]; smartImport_collect(buf,'xlsx','datei'); finalizeMultiImport(); }

// ── Extract readable caption from LinkedIn post URL slug
function extractCaptionFromUrl(url) {
  if (!url) return '';
  try {
    const m = url.match(/\/posts\/[^_/]+_(.+?)(?:\?|#|$)/);
    if (!m) return url.split('/').pop().slice(0,80);
    let slug = decodeURIComponent(m[1]);
    // Remove trailing post ID + short code (e.g. -7404056454661320706-AcMt)
    slug = slug.replace(/-[A-Za-z0-9]{3,6}$/, '').replace(/-\d{15,}$/, '');
    // Remove action type suffix
    slug = slug.replace(/-(share|ugcPost|activity|videoActivity)$/i, '');
    return slug.replace(/-/g, ' ').trim();
  } catch(e) { return ''; }
}

// ── LinkedIn AggregateAnalytics Excel parser (EN + DE sheet names)
function parseLinkedInAggregateAnalytics(wb) {
  // Support English and German LinkedIn export sheet names
  const ws = n => wb.Sheets[n];
  const engWs  = ws('ENGAGEMENT');
  const topWs  = ws('TOP POSTS') || ws('TOP-BEITRÄGE') || ws('TOP BEITRÄGE');
  const follWs = ws('FOLLOWERS') || ws('FOLLOWER_INNEN') || ws('FOLLOWER:INNEN');
  if (!engWs) return null;

  const engRows = XLSX.utils.sheet_to_json(engWs, {header:1, defval:'', raw:false});
  // Find header row dynamically (EN: Date/Impressions/Engagements, DE: Datum/Impressionen/Interaktionen)
  let engDataStart = 0;
  let engImprCol = 1, engEngCol = 2;
  for (let i = 0; i < Math.min(6, engRows.length); i++) {
    const row = engRows[i];
    const joined = row.map(c=>String(c||'').toLowerCase()).join(' ');
    if (joined.includes('date') || joined.includes('datum')) {
      engDataStart = i + 1;
      row.forEach((h,j) => {
        const hh = String(h||'').toLowerCase();
        if (hh.includes('impression')) engImprCol = j;
        if (hh.includes('engagement') || hh.includes('interaktion') || hh.includes('reaction')) engEngCol = j;
      });
      break;
    }
  }
  const monthMap = new Map();
  for (let i = engDataStart; i < engRows.length; i++) {
    const row = engRows[i];
    const dateStr = String(row[0]||'').trim();
    if (!dateStr) continue;
    const parsed = parseDate(dateStr);
    if (!parsed) continue;
    const key = `${parsed.year}-${String(parsed.month+1).padStart(2,'0')}`;
    if (!monthMap.has(key)) {
      monthMap.set(key, {label:fmtMonthLabel(parsed.year,parsed.month), sortKey:key,
        impressions:0, engagements:0, newFollowers:0, followers:0});
    }
    const m = monthMap.get(key);
    m.impressions += parseNum(row[engImprCol]);
    m.engagements += parseNum(row[engEngCol]);
  }

  // FOLLOWERS sheet → new followers per month + total at end
  let totalFollowers = 0;
  if (follWs) {
    const follRows = XLSX.utils.sheet_to_json(follWs, {header:1, defval:'', raw:false});
    // Find total followers — scan first 6 rows, all columns
    for (let i = 0; i < Math.min(6, follRows.length) && !totalFollowers; i++) {
      const row = follRows[i];
      for (let j = 0; j < row.length; j++) {
        const lbl = String(row[j]||'').toLowerCase();
        if (lbl.includes('total') || lbl.includes('gesamt') || lbl.includes('follower') || lbl.includes('follower:innen')) {
          const val = parseNum(row[j+1]);
          if (val > 0) { totalFollowers = val; break; }
        }
      }
    }
    // Find date header row (EN: "date", DE: "datum") — scan all rows up to 15
    let dataStart = -1;
    let follCol = 1; // default: new followers in column 1
    for (let i = 0; i < Math.min(15, follRows.length); i++) {
      const row = follRows[i];
      const c0 = String(row[0]||'').toLowerCase();
      if (c0.includes('date') || c0.includes('datum')) {
        dataStart = i + 1;
        // Find the column with "new" or "neu" or "follower"
        for (let j = 1; j < row.length; j++) {
          const h = String(row[j]||'').toLowerCase();
          if (h.includes('new') || h.includes('neu') || h.includes('follower') || h.includes('abonnent')) {
            follCol = j; break;
          }
        }
        break;
      }
    }
    if (dataStart >= 0) {
      for (let i = dataStart; i < follRows.length; i++) {
        const row = follRows[i];
        const parsed = parseDate(String(row[0]||'').trim());
        if (!parsed) continue;
        const key = `${parsed.year}-${String(parsed.month+1).padStart(2,'0')}`;
        const m = monthMap.get(key);
        if (m) m.newFollowers += parseNum(row[follCol]);
      }
    }
  }

  const sorted = [...monthMap.values()].sort((a,b) => a.sortKey.localeCompare(b.sortKey));

  // TOP POSTS sheet — two side-by-side tables merged by URL
  const autoPosts = [];
  const autoFlopPosts = [];
  // postsPerMonthMap: sortKey → count (aus TOP-Beiträge Sheet)
  const postsPerMonthMap = new Map();
  if (topWs && sorted.length > 0) {
    const topRows = XLSX.utils.sheet_to_json(topWs, {header:1, defval:'', raw:false});
    const postMap = new Map();
    for (let i = 3; i < topRows.length; i++) {
      const row = topRows[i];
      // Left list: top by Engagements
      const url1 = String(row[0]||'').trim();
      if (url1 && url1.includes('linkedin.com')) {
        if (!postMap.has(url1)) postMap.set(url1, {url:url1, date:String(row[1]||'').trim(), eng:0, impr:0});
        postMap.get(url1).eng = Math.max(postMap.get(url1).eng, parseNum(row[2]));
      }
      // Right list: top by Impressions
      const url2 = String(row[4]||'').trim();
      if (url2 && url2.includes('linkedin.com')) {
        if (!postMap.has(url2)) postMap.set(url2, {url:url2, date:String(row[5]||'').trim(), eng:0, impr:0});
        postMap.get(url2).impr = Math.max(postMap.get(url2).impr, parseNum(row[6]));
      }
    }
    // Zähle Posts pro Monat anhand Veröffentlichungsdatum
    postMap.forEach(p => {
      const parsed = parseDate(p.date);
      if (!parsed) return;
      const key = `${parsed.year}-${String(parsed.month+1).padStart(2,'0')}`;
      postsPerMonthMap.set(key, (postsPerMonthMap.get(key)||0) + 1);
    });
    const allSorted = [...postMap.values()].sort((a,b) => b.impr - a.impr || b.eng - a.eng);
    allSorted.slice(0, 10).forEach(p => {
        const caption = extractCaptionFromUrl(p.url);
        autoPosts.push({impr:p.impr, eng:p.eng, likes:0, comm:0, shar:0,
          caption: caption || p.url.slice(-60), date:p.date, url:p.url});
      });
    // NOTE: LinkedIn exportiert nur die TOP-50 Beiträge — keine echten Flop-Posts erkennbar.
    // autoFlopPosts bleibt leer → Nutzer trägt Flop-Posts manuell ein.
  }

  const d = {
    labels:         sorted.map(m => m.label),
    impressions:    sorted.map(m => m.impressions),
    followers:      sorted.map(m => m.newFollowers),  // neue Follower pro Monat (direkt aus Export)
    engagements:    sorted.map(m => m.engagements),
    postsPerMonth:  sorted.map(m => postsPerMonthMap.get(m.sortKey) || 0),
    _sortKeys:      sorted.map(m => m.sortKey),
    totalFollowers: totalFollowers  // Gesamtfollower (z.B. 4487)
  };

  if (!d.labels.length) return null;
  return { d, mode:'post-level', months:d.labels.length, totalRows:sorted.length, autoPosts, autoFlopPosts };
}
function smartImport_fromCSV(text) { _multiResults=[]; smartImport_collect(text,'csv','datei'); finalizeMultiImport(); }

function smartImport(rows) {
  const result = smartImport_parse(rows);
  if (result) showImportPreview(result.d, result.mode, result.months, result.totalRows, result.autoPosts, null, result.autoFlopPosts);
}

// Parse rows → result object (no side effects)
function smartImport_parse(rows) {
  if (!rows || rows.length < 2) return null;

  // 1. Find header row
  let headerIdx = 0;
  for (let i = 0; i < Math.min(6, rows.length); i++) {
    const joined = rows[i].map(c=>String(c||'')).join(' ').toLowerCase();
    if (/datum|date|monat|month|impressi|erstellt|veröffent|published|created|beitrags|post|likecount|caption|username|network/i.test(joined)) {
      headerIdx = i; break;
    }
  }
  const header = rows[headerIdx].map(c => String(c||'').toLowerCase().trim());

  // 2. Detect columns
  const ci = {
    date:        findCol(header, ['datum','veröffentlichungsdatum','date','erstellt','published','created','monat','month','zeit']),
    impressions: findCol(header, ['impression','reichweite','views','aufrufe','sichtbarkeit','mitglieder erreicht','erreicht','viewcount']),
    likes:       findCol(header, ['reaktion','like','gefällt mir','gefällt','reaction','likecount']),
    comments:    findCol(header, ['kommentar','comment','commentcount']),
    shares:      findCol(header, ['weiterleit','share','repost','geteilt','sharecount']),
    clicks:      findCol(header, ['klick','click']),
    followers:   findCol(header, ['neue follower','new follower','follower','abonnent','follower-zuwachs']),
    engagements: findCol(header, ['interaktion','engagement','gesamt-engagement','engagementcount']),
    engRate:     findCol(header, ['interaktionsrate','engagement rate','engagementrate','engagementrate']),
    postsCount:  findCol(header, ['anzahl','post count','beitragsanzahl']),
    caption:     findCol(header, ['beitragstext','beitragstitel','caption','text','inhalt','title','beschreibung','post-text','beitrag','post text','nachricht','message']),
    url:         findCol(header, ['mediaurl','url','link','beitrags-url']),
    network:     findCol(header, ['network','platform','netzwerk']),
  };
  if (ci.date < 0) ci.date = 0;

  const dataRows = rows.slice(headerIdx + 1).filter(r =>
    r.some(c => c !== '' && c !== null && c !== undefined)
  );
  if (!dataRows.length) return null;

  const firstDateVal = dataRows[0][ci.date];
  const hasDay = isFullDate(String(firstDateVal||''));
  const manyRows = dataRows.length > 24;
  const mode = (hasDay || manyRows) ? 'post-level' : 'monthly';

  if (mode === 'post-level') return importPostLevel_parse(dataRows, ci);
  else return importMonthly_parse(dataRows, ci);
}

// ── Mode A: Post-Level Data (1 row per post) → aggregate by month
function importPostLevel_parse(dataRows, ci) {
  const monthMap = new Map();
  dataRows.forEach(row => {
    // Favikon: filter to LinkedIn only if network column exists
    if (ci.network>=0) {
      const net = String(row[ci.network]||'').toLowerCase().trim();
      if (net && net !== 'linkedin') return; // skip non-LinkedIn rows
    }
    const parsed = parseDate(row[ci.date]);
    if (!parsed) return;
    const key = `${parsed.year}-${String(parsed.month+1).padStart(2,'0')}`;
    if (!monthMap.has(key)) {
      monthMap.set(key, { label:fmtMonthLabel(parsed.year,parsed.month), sortKey:key,
        impressions:0, followers:0, engagements:0, posts:0, rawPosts:[] });
    }
    const m = monthMap.get(key);
    const impr  = ci.impressions>=0 ? parseNum(row[ci.impressions]) : 0;
    const likes = ci.likes>=0       ? parseNum(row[ci.likes])       : 0;
    const comm  = ci.comments>=0    ? parseNum(row[ci.comments])    : 0;
    const shar  = ci.shares>=0      ? parseNum(row[ci.shares])      : 0;
    const foll  = ci.followers>=0   ? parseNum(row[ci.followers])   : 0;
    const eng   = ci.engagements>=0 ? parseNum(row[ci.engagements]) : (likes + comm + shar);
    const cap   = ci.caption>=0     ? String(row[ci.caption]||'').trim() : '';
    const lbl   = String(row[ci.date]||'').trim();
    const url   = ci.url>=0         ? String(row[ci.url]||'').trim() : '';
    m.impressions += impr; m.followers += foll; m.engagements += eng; m.posts++;
    if (cap || impr>0) m.rawPosts.push({ impr, likes, comm, shar, eng, caption:cap, date:lbl, url });
  });
  const sorted = [...monthMap.values()].sort((a,b) => a.sortKey.localeCompare(b.sortKey));
  const d = {
    labels: sorted.map(m=>m.label), impressions: sorted.map(m=>m.impressions),
    followers: sorted.map(m=>m.followers), engagements: sorted.map(m=>m.engagements),
    postsPerMonth: sorted.map(m=>m.posts), _sortKeys: sorted.map(m=>m.sortKey)
  };
  const allPosts = sorted.flatMap(m=>m.rawPosts).filter(p=>p.caption).sort((a,b)=>b.impr-a.impr).slice(0,10);
  return { d, mode:'post-level', months:sorted.length, totalRows:dataRows.length, autoPosts:allPosts };
}

// ── Mode B: Monthly Summary (1 row per month)
function importMonthly_parse(dataRows, ci) {
  const d = { labels:[], impressions:[], followers:[], engagements:[], postsPerMonth:[], _sortKeys:[] };
  dataRows.forEach(row => {
    const lbl = String(row[ci.date]||'').trim();
    if (!lbl) return;
    const parsed = parseDate(lbl);
    const label = parsed ? fmtMonthLabel(parsed.year, parsed.month) : lbl;
    const sortKey = parsed ? `${parsed.year}-${String(parsed.month+1).padStart(2,'0')}` : lbl;
    d.labels.push(label); d._sortKeys.push(sortKey);
    d.impressions.push(ci.impressions>=0  ? parseNum(row[ci.impressions])  : parseNum(row[1]));
    d.followers.push(  ci.followers>=0    ? parseNum(row[ci.followers])    : parseNum(row[2]));
    d.engagements.push(ci.engagements>=0  ? parseNum(row[ci.engagements])  : (ci.likes>=0 ? parseNum(row[ci.likes])+(parseNum(row[ci.comments]||0))+(parseNum(row[ci.shares]||0)) : parseNum(row[3])));
    d.postsPerMonth.push(ci.postsCount>=0 ? parseNum(row[ci.postsCount])   : parseNum(row[4]));
  });
  return { d, mode:'monthly', months:d.labels.length, totalRows:dataRows.length, autoPosts:[] };
}

// ── Merge multiple parsed results into one
function mergeImportResults(results) {
  if (!results.length) return null;
  if (results.length === 1) return results[0];

  // Merge all into a map keyed by sortKey
  const mergeMap = new Map(); // sortKey → {label, impressions, followers, engagements, postsPerMonth}
  let allPosts = [];
  let allFlopPosts = [];

  results.forEach(res => {
    const { d, autoPosts } = res;
    const keys = d._sortKeys || d.labels;
    keys.forEach((key, i) => {
      if (!mergeMap.has(key)) {
        mergeMap.set(key, { label:d.labels[i], sortKey:key, impressions:0, followers:0, engagements:0, postsPerMonth:0 });
      }
      const m = mergeMap.get(key);
      // Add impressions/engagements; for followers take the max (not cumulative)
      m.impressions   += (d.impressions[i]   || 0);
      m.followers      = Math.max(m.followers, d.followers[i] || 0);
      m.engagements   += (d.engagements[i]   || 0);
      m.postsPerMonth += (d.postsPerMonth[i] || 0);
    });
    allPosts = allPosts.concat(autoPosts || []);
    allFlopPosts = allFlopPosts.concat(res.autoFlopPosts || []);
  });

  const sorted = [...mergeMap.values()].sort((a,b) => a.sortKey.localeCompare(b.sortKey));
  const totalFollowers = results.reduce((best, r) => Math.max(best, r.d?.totalFollowers || 0), 0);
  const d = {
    labels: sorted.map(m=>m.label), _sortKeys: sorted.map(m=>m.sortKey),
    impressions: sorted.map(m=>m.impressions), followers: sorted.map(m=>m.followers),
    engagements: sorted.map(m=>m.engagements), postsPerMonth: sorted.map(m=>m.postsPerMonth),
    totalFollowers
  };
  allPosts = allPosts.sort((a,b)=>b.impr-a.impr).slice(0,10);
  allFlopPosts = allFlopPosts.sort((a,b)=>a.impr-b.impr).slice(0,5);

  const totalRows = results.reduce((s,r)=>s+r.totalRows,0);
  const modeLabel = results.map(r=>r._filename||r.mode).join(' + ');
  return { d, mode:'merged', months:sorted.length, totalRows, autoPosts:allPosts, autoFlopPosts:allFlopPosts, _mergeLabel:modeLabel };
}

// ── Called when all files in queue are processed
function finalizeMultiImport() {
  resetUploadZone();
  if (!_multiResults.length) { showToast('Keine Daten erkannt — Format prüfen','warn'); return; }

  let finalResult;
  if (_mergeMode) {
    // Merge with already-saved client data (not _pendingImport which may be null)
    const c = getClient(ROUTE.clientId);
    if (c && c.monthly && c.monthly.labels && c.monthly.labels.length) {
      const existingResult = {
        d: c.monthly,
        autoPosts: c.posts || [],
        autoFlopPosts: c.flopPosts || [],
        totalRows: c.monthly.labels.length,
        _filename: null
      };
      finalResult = mergeImportResults([existingResult, ..._multiResults]);
    } else {
      finalResult = mergeImportResults(_multiResults);
    }
  } else {
    finalResult = mergeImportResults(_multiResults);
  }

  if (!finalResult) { showToast('Zusammenführen fehlgeschlagen','warn'); return; }

  // Direkt speichern — sofort, kein extra Klick nötig
  _pendingImport = { d: finalResult.d, autoPosts: finalResult.autoPosts || [], autoFlopPosts: finalResult.autoFlopPosts || [] };
  confirmImport();
}

function confirmImport() {
  if (!_pendingImport) return;
  const { d, autoPosts, autoFlopPosts } = _pendingImport;
  console.log('[Import] confirmImport called, labels:', d?.labels?.length, d?.labels?.slice(0,3));
  const c = getClient(ROUTE.clientId);
  if (!c) return;

  // Guard: never save empty results
  if (!d || !d.labels || d.labels.length === 0) {
    showToast('⚠️ Keine Zeiträume erkannt — Format wird nicht unterstützt', 'warn');
    _pendingImport = null;
    return;
  }

  // Save data
  c.monthly = d;
  if (autoPosts && autoPosts.length) {
    const existing = new Set((c.posts||[]).map(p=>p.caption));
    const newPosts = autoPosts.filter(p => !existing.has(p.caption)).map(p => ({
      caption: p.caption, label: p.date || '',
      impr: p.impr, likes: p.likes || 0, comments: p.comm || 0,
      shares: p.shar || 0, eng: p.eng || 0, url: p.url || '', type: 'story'
    }));
    c.posts = [...(c.posts||[]), ...newPosts].sort((a,b)=>b.impr-a.impr).slice(0,10);
  }
  if (autoFlopPosts && autoFlopPosts.length) {
    // Always replace flop posts with freshly detected ones from the file
    c.flopPosts = autoFlopPosts.map(p => ({
      caption: p.caption, label: p.date || '',
      impr: p.impr, likes: p.likes || 0, comments: p.comm || 0,
      shares: p.shar || 0, eng: p.eng || 0, url: p.url || '', type: 'story'
    })).sort((a,b)=>a.impr-b.impr).slice(0,5);
  }
  const newNames = (_multiResults||[]).map(r => r._filename).filter(Boolean);
  if (!c._loadedFiles) c._loadedFiles = [];
  newNames.forEach(n => { if (!c._loadedFiles.includes(n)) c._loadedFiles.push(n); });
  c.updatedAt = Date.now();
  saveApp();
  _pendingImport = null;

  // Re-render the entire edit view so data table, buttons, split select all appear correctly
  showToast(`✅ ${d.labels.length} Monate · ${c.posts?.length||0} Top-Posts · ${c.flopPosts?.length||0} Flop-Posts · ${d.totalFollowers ? fmt(d.totalFollowers)+' Follower' : ''}`, 'ok');
  navigate('edit', ROUTE.clientId, 'data');
}

// Hex-Farbe mit Weiß mischen (ratio 0=weiß, 1=originalfarbe)
function blendWithWhite(hex, ratio) {
  hex = hex.replace('#','');
  if (hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return '#'+[r,g,b].map(c=>Math.round(c*ratio+255*(1-ratio)).toString(16).padStart(2,'0')).join('');
}
// CI-Farbpalette: nutzt color2/color3 wenn gesetzt, sonst Abstufungen der Primärfarbe
function ciPalette(primary, ci) {
  const c2 = ci?.color2 && ci.color2 !== primary ? ci.color2 : blendWithWhite(primary, 0.65);
  const c3 = ci?.color3 && ci.color3 !== primary ? ci.color3 : blendWithWhite(primary, 0.45);
  return [primary, c2, c3, blendWithWhite(primary, 0.30)];
}

// Sammle alle custom Labels aus den Posts eines Clients
function getProjectCustomTypes(c) {
  if (!c) return [];
  const known = new Set(Object.keys(TYPE_META));
  const custom = new Map(); // label → true (dedupliziert)
  [...(c.posts||[]), ...(c.flopPosts||[])].forEach(p => {
    if (p.type && !known.has(p.type)) custom.set(p.type, true);
  });
  return [...custom.keys()];
}

function _typeSelectHtml(type, extraCustomTypes) {
  const isKnown = !!TYPE_META[type];
  const cval = isKnown ? '' : type;
  const selVal = isKnown ? type : '_custom_';
  const baseOpts = Object.entries(TYPE_META)
    .filter(([v]) => !['brand','network','thought','industry'].includes(v))
    .map(([v,m]) => `<option value="${v}" ${v===selVal?'selected':''}>${m.label}</option>`).join('');
  // Bereits gespeicherte Custom-Labels als eigene Optionen
  const savedCustomOpts = (extraCustomTypes||[])
    .filter(t => t !== type) // aktueller type wird unten separat behandelt
    .map(t => `<option value="_custom_${encodeURIComponent(t)}">${t}</option>`).join('');
  // Aktueller custom type als eigene Option
  const currentCustomOpt = (!isKnown && type) ? `<option value="_custom_${encodeURIComponent(type)}" selected>${type}</option>` : '';
  const opts = baseOpts + (savedCustomOpts||currentCustomOpt ? `<optgroup label="── Eigene Labels ──">${currentCustomOpt}${savedCustomOpts}</optgroup>` : '')
    + `<option value="_custom_">＋ Neues Label…</option>`;
  return { opts, isKnown, cval };
}

function renderCharts(c, ins) {
  const m = c.monthly;
  const primary = c.ci.primary;
  const splitIdx = c.splitLabel ? m.labels.indexOf(c.splitLabel) : -1;
  const gridC = 'rgba(0,0,0,0.05)', txtC = '#6E7A9F';
  const base = { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} };
  const xScale = { ticks:{color:txtC,font:{size:10},autoSkip:false,maxRotation:45}, grid:{color:gridC} };
  const yScale = (cb) => ({ ticks:{color:txtC,font:{size:10},callback:cb||(v=>v)}, grid:{color:gridC} });
  const barColors = m.labels.map((_,i) => splitIdx>=0 ? (i<splitIdx?'#D93B3B':primary) : primary);

  destroyChart('impr');
  const cImpr = document.getElementById('cImpr');
  if (cImpr) charts.impr = new Chart(cImpr, splitIdx > 0 ? {
    type:'bar', data:{ labels:m.labels, datasets:[
      { label:'Vorher', data:m.impressions.map((v,i)=>i<splitIdx?v:0), backgroundColor:'#D93B3B', borderRadius:4 },
      { label:'Nachher', data:m.impressions.map((v,i)=>i>=splitIdx?v:0), backgroundColor:primary, borderRadius:4 }
    ]}, options:{...base, scales:{ x:{...xScale,stacked:true}, y:{...yScale(v=>v>=1000?(v/1000).toFixed(0)+'K':v),stacked:true} }}
  } : {
    type:'bar', data:{ labels:m.labels, datasets:[{ data:m.impressions, backgroundColor:primary, borderRadius:4 }]},
    options:{...base, scales:{ x:xScale, y:yScale(v=>v>=1000?(v/1000).toFixed(0)+'K':v) }}
  });

  destroyChart('foll');
  const cFoll = document.getElementById('cFoll');
  if (cFoll) charts.foll = new Chart(cFoll, { type:'bar', data:{ labels:m.labels, datasets:[{data:m.followers,backgroundColor:barColors,borderRadius:3}]}, options:{...base,scales:{x:xScale,y:yScale()}} });

  destroyChart('eng');
  const cEng = document.getElementById('cEng');
  if (cEng) charts.eng = new Chart(cEng, { type:'line', data:{ labels:m.labels, datasets:[{data:m.engagements,borderColor:primary,backgroundColor:primary+'22',fill:true,pointBackgroundColor:barColors,pointRadius:4,borderWidth:2,tension:0.35}]}, options:{...base,scales:{x:xScale,y:yScale()}} });

  destroyChart('posts');
  const cPosts = document.getElementById('cPosts');
  if (cPosts && c.posts?.length) {
    charts.posts = new Chart(cPosts, { type:'bar', data:{ labels:c.posts.map(p=>p.label||p.caption.slice(0,28)+'…'), datasets:[{data:c.posts.map(p=>p.impr),backgroundColor:c.posts.map((_p,_i)=>ciPalette(primary,c.ci)[Math.min(_i,3)]),borderRadius:5,borderSkipped:false}]}, options:{...base,indexAxis:'y',scales:{x:{ticks:{color:txtC,font:{size:10},callback:v=>v>=1000?(v/1000).toFixed(0)+'K':v},grid:{color:gridC}},y:{ticks:{color:txtC,font:{size:10}},grid:{display:false}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+ctx.parsed.x.toLocaleString('de-DE')+' Impressionen'}}}} });
  }
}

function analyzeContentMix(posts, flopPosts, primary, ci) {
  if (!posts || posts.length === 0) {
    // Fallback defaults
    return [
      { num:'2×', color:'#00A86B', title:'Persönlich / Humor',  sub:'Reichweite maximieren' },
      { num:'2×', color:primary,   title:'Tech / Trend',        sub:'Neue Zielgruppen erschließen' },
      { num:'1×', color:'#C89500', title:'Meinung / Daten',     sub:'Thought Leadership aufbauen' },
      { num:'3×', color:'#6E7A9F', title:'Brand / Story',       sub:'Basis-Rhythmus halten' },
    ];
  }

  // Group top posts by type → avg impressions + avg engagement
  const typeStats = {};
  posts.forEach(p => {
    const t = p.type || 'story';
    if (!typeStats[t]) typeStats[t] = { imprSum:0, engSum:0, count:0 };
    typeStats[t].imprSum += p.impr || 0;
    typeStats[t].engSum  += (p.eng || 0) + (p.likes || 0) + (p.comments || 0) + (p.shares || 0);
    typeStats[t].count   += 1;
  });
  // Penalty: types that appear in flopPosts lose score
  (flopPosts || []).forEach(p => {
    const t = p.type || 'story';
    if (!typeStats[t]) typeStats[t] = { imprSum:0, engSum:0, count:0 };
    typeStats[t].imprSum -= (p.impr || 0) * 0.5; // reduce by half their flop impact
  });

  const ranked = Object.entries(typeStats).map(([type, s]) => {
    const avgImpr = s.count > 0 ? s.imprSum / s.count : 0;
    const avgEng  = s.count > 0 ? s.engSum  / s.count : 0;
    const score   = avgImpr + avgEng * 5;
    return { type, avgImpr: Math.max(0,avgImpr), score, count: s.count };
  }).sort((a,b) => b.score - a.score);

  const metaTitles = {
    humor:   'Persönlich / Humor',
    tech:    'Tech / Trend',
    network: 'Networking',
    networking: 'Networking',
    story:   'Brand / Story',
    brand:   'Brand / Story',
    branch:  'Branchenwissen',
    industry:'Branchenwissen',
    thought: 'Thought Leadership',
  };
  const palette = ciPalette(primary || '#5B63FE', ci);

  return ranked.map((r, i) => {
    const title = metaTitles[r.type] || r.type; // custom type: direkt als Titel
    const num = i === 0 ? '3–4×' : i === 1 ? '2–3×' : i < 3 ? '1–2×' : '1×';
    const avgLabel = r.avgImpr > 0 ? `Ø ${fmt(Math.round(r.avgImpr))} Impr.` : 'Kontinuität';
    return { num, color: palette[Math.min(i, palette.length-1)], title, sub: avgLabel };
  });
}

function analyze(monthly, splitLabel, primary, posts, flopPosts, ci) {
  const {labels,impressions,followers,engagements,postsPerMonth} = monthly;
  const n = labels.length;
  const totalImpr = sum(impressions), totalFoll = sum(followers), totalEng = sum(engagements);
  const totalPosts = sum(postsPerMonth);
  const avgEngRate = totalImpr > 0 ? totalEng/totalImpr*100 : 0;
  const avgPostsPerMonth = n > 0 ? totalPosts/n : 0;
  const bestImprIdx = impressions.indexOf(Math.max(...impressions));
  const third = Math.max(1,Math.floor(n/3));
  const firstAvg = avg(impressions.slice(0,third)), lastAvg = avg(impressions.slice(-third));
  const trendPct = firstAvg > 0 ? Math.round((lastAvg-firstAvg)/firstAvg*100) : 0;
  const trend = trendPct>15?'wachsend':trendPct<-15?'rückläufig':'stabil';
  let engLabel, engColor;
  if (avgEngRate>=4)      {engLabel='Exzellent';engColor='#00A86B';}
  else if (avgEngRate>=2) {engLabel='Gut';engColor='#00A86B';}
  else if (avgEngRate>=1) {engLabel='Durchschnitt';engColor='#F59E0B';}
  else                    {engLabel='Unter Benchmark';engColor='#E03B3B';}
  let beforeAfter = null;
  if (splitLabel) {
    const si = labels.indexOf(splitLabel);
    if (si > 0) {
      const b = { avgImpr:avg(impressions.slice(0,si)), avgFoll:avg(followers.slice(0,si)), avgEng:avg(engagements.slice(0,si)), avgPosts:avg(postsPerMonth.slice(0,si)), label:`${labels[0]} – ${labels[si-1]}` };
      const a = { avgImpr:avg(impressions.slice(si)), avgFoll:avg(followers.slice(si)), avgEng:avg(engagements.slice(si)), avgPosts:avg(postsPerMonth.slice(si)), label:`${labels[si]} – ${labels[n-1]}` };
      beforeAfter = { before:b, after:a, imprGrowth:b.avgImpr>0?Math.round((a.avgImpr-b.avgImpr)/b.avgImpr*100):0, follGrowth:b.avgFoll>0?Math.round((a.avgFoll-b.avgFoll)/b.avgFoll*100):0, splitIdx:si };
    }
  }
  const p = primary || '#5B63FE';
  // Auto-generate recommendations
  const recommendations = [
    trend==='wachsend' ? {
      color:'#00A86B', badgeBg:'#E8F8F2', badgeCol:'#00624A', badge:'Reichweite',
      val:`+${trendPct}% Wachstum`, title:'Momentum ausbauen',
      body:`Bester Monat: ${labels[bestImprIdx]} mit ${fmt(impressions[bestImprIdx])} Impressionen. Das erfolgreiche Format gezielt wiederholen und ausbauen — Konsistenz ist der stärkste Wachstumshebel auf LinkedIn.`,
      rec:`Bestseller-Format 1× pro Monat wiederholen`
    } : trend==='rückläufig' ? {
      color:'#E03B3B', badgeBg:'#FFE8E8', badgeCol:'#8A0000', badge:'Handlungsbedarf',
      val:`${trendPct}% Rückgang`, title:'Content-Strategie anpassen',
      body:`Reichweite ist rückläufig. Bester Monat war ${labels[bestImprIdx]} (${fmt(impressions[bestImprIdx])} Impressionen). Persönliche Geschichten, klare Meinungen und Branchentrends reaktivieren die Reichweite nachhaltig.`,
      rec:`Neues Format testen: 1× persönlicher Post + 1× Meinung pro Monat`
    } : {
      color:'#F59E0B', badgeBg:'#FFF0E8', badgeCol:'#7A3000', badge:'Potenzial',
      val:'Stabiler Verlauf', title:'Nächste Wachstumsstufe',
      body:`Stabile Performance, aber ungenutztes Potenzial. Bester Monat: ${labels[bestImprIdx]} (${fmt(impressions[bestImprIdx])} Impressionen). Durch höhere Frequenz und gezielte Engagement-Trigger lässt sich die Kurve deutlich nach oben biegen.`,
      rec:`Posting-Frequenz auf ${Math.max(6,Math.round(avgPostsPerMonth)+2)}× / Monat steigern`
    },
    avgEngRate >= 3 ? {
      color:'#5B63FE', badgeBg:'#EEEFFE', badgeCol:'#2D3561', badge:'Engagement',
      val:`${avgEngRate.toFixed(1)}% Ø Rate`, title:'Starke Community-Bindung',
      body:`${avgEngRate.toFixed(1)}% liegt ${avgEngRate>=4?'weit ':''}über dem B2B-Benchmark von 1–2%. Die Follower sind aktiv und interessiert. Jeder Kommentar der beantwortet wird befeuert den LinkedIn-Algorithmus zusätzlich.`,
      rec:`Kommentare aktiv beantworten innerhalb von 2 Stunden`
    } : {
      color:'#F59E0B', badgeBg:'#FFF9D6', badgeCol:'#7A5C00', badge:'Engagement',
      val:`${avgEngRate.toFixed(1)}% Ø Rate`, title:'Engagement-Rate steigern',
      body:`Mit ${avgEngRate.toFixed(1)}% liegt die Rate ${avgEngRate>=1?'im Durchschnitt':'unter dem'} B2B-Benchmark (1–2%). Jeder Post sollte mit einer konkreten Frage enden. Umfragen und persönliche Standpunkte steigern die Interaktion signifikant.`,
      rec:`Jeden Post mit einer direkten Frage an die Community beenden`
    },
    {
      color: p, badgeBg: p+'22', badgeCol: p, badge:'Frequenz',
      val:`Ø ${avgPostsPerMonth>0?avgPostsPerMonth.toFixed(1):'—'} Posts / Monat`, title:'Content-Kadenz optimieren',
      body: avgPostsPerMonth >= 6
        ? `Mit Ø ${avgPostsPerMonth.toFixed(1)} Posts / Monat ist der Rhythmus stark. LinkedIn belohnt Konstanz — diesen Takt halten und die Qualität durch bessere Hooks und klare Kernaussagen weiter steigern.`
        : `Ein regelmäßiger Rhythmus von 6–8 Posts / Monat ist einer der stärksten Hebel für organische LinkedIn-Reichweite. Aktuell Ø ${avgPostsPerMonth.toFixed(1)} Posts — hier liegt das größte Wachstumspotenzial.`,
      rec: avgPostsPerMonth < 6 ? `Frequenz schrittweise auf 6–8× / Monat erhöhen` : `Qualität weiter steigern: starke Hook in Zeile 1`
    }
  ];
  // Auto-analyze content mix from posts data
  const contentMix = analyzeContentMix(posts, flopPosts, p, ci);
  const totalFollowersNow = monthly.totalFollowers || 0; // from AggregateAnalytics (e.g. 4487)
  return { totalImpr, totalFoll, totalEng, avgEngRate, avgPostsPerMonth, bestImprIdx, trendPct, trend, engLabel, engColor, beforeAfter, recommendations, contentMix, n, totalFollowersNow };
}
